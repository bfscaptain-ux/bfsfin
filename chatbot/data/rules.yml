version: "3.1"

rules:

- rule: Say goodbye anytime the user says goodbye
  steps:
  - intent: goodbye
  - action: utter_goodbye

- rule: Say 'I am a bot' anytime the user challenges
  steps:
  - intent: bot_challenge
  - action: utter_iamabot

- rule: Respond to how are you
  steps:
  - intent: smalltalk_how_are_you
  - action: utter_how_are_you

- rule: Respond to thank you
  steps:
  - intent: thank_you
  - action: utter_welcome

- rule: Comfort user about CIBIL
  steps:
  - intent: express_worry_cibil
  - action: utter_comfort_cibil

- rule: Respond to Finance General
  steps:
  - intent: ask_finance_general
  - action: utter_finance_general

